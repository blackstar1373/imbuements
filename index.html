<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market ou Gold Token?</title>
<style>
:root{--bg:#121317;--panel:#1a1b20;--box:#23252b;--field:#111216;--line:#2e3036;--text:#f2f3f5;--muted:#aeb3bb;--label:#aeb3bb;--gold:#5865f2;--focus:#949cf7;--best-bg:#4752c4;--win:#23a559;--win-text:#57f287}
*{box-sizing:border-box}
body{margin:0;padding:20px 16px;background:var(--bg);color:var(--text);font:15px/1.4 "gg sans","Noto Sans","Segoe UI",system-ui,sans-serif}
.app{max-width:1000px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:22px}
.pill{border:1px solid var(--gold);color:#dfe1ff;background:var(--box);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.cfg{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
label.lb{display:block;font-size:12px;font-weight:700;color:var(--label);margin-bottom:6px;letter-spacing:.03em}
.inp{width:100%;background:transparent;border:0;color:var(--text);font-size:16px;padding:12px;outline:none}
.pricebox{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:8px;padding-right:12px}
.pricebox:focus-within{border-color:var(--focus)}
.gp{color:#949ba4;font-weight:700;margin-left:6px}
select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:16px;padding:12px 10px}
select:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--field);border-radius:10px;padding:4px;margin:18px 0 14px}
.tab{background:transparent;border:0;color:var(--muted);font-weight:700;font-size:15px;padding:11px;cursor:pointer;border-radius:7px}
.tab[aria-selected=true]{background:var(--gold);color:#fff}
.row{display:grid;grid-template-columns:minmax(140px,1fr) minmax(130px,190px) auto;gap:14px;align-items:end;background:var(--box);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.mat{display:flex;gap:12px;align-items:center;align-self:center}
.ico{width:42px;height:42px;border-radius:8px;background:var(--field);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ico img{width:32px;height:32px;image-rendering:pixelated}
.mat b{display:block}
.mat span{color:var(--muted);font-size:13px}
.tg{display:flex;gap:6px}
.opt{width:42px;height:42px;border-radius:8px;background:var(--field);border:1px solid var(--line);cursor:pointer;position:relative;opacity:.5;padding:4px;display:grid;place-items:center}
.opt img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.opt[aria-pressed=true]{opacity:1;border-color:var(--gold);background:#383d7a}
.opt[aria-pressed=true]::after{content:"✓";position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px;font-weight:800;line-height:16px}
.results{display:grid;gap:12px;position:sticky;top:16px}
.box{border-radius:12px;padding:16px 18px;border:1px solid var(--line)}
.best{background:var(--best-bg);border-color:transparent;padding:22px}
.best h3{margin:0 0 6px;color:#fff;font-size:15px}
.big{font-size:38px;font-weight:800;line-height:1.1}
.big small{font-size:16px;color:#dbdeff;font-weight:600}
.best p{margin:10px 0 0;color:#e3e5ff;font-size:14px}
.m,.t{background:var(--box);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.box h4{margin:0;color:#dbdee1;font-weight:600}
.box b{font-size:17px;text-align:right}
.hi{width:20px;height:20px;vertical-align:-4px;image-rendering:pixelated}
.diff{grid-column:1/-1;color:var(--muted);font-size:14px}
.box.win{border-color:var(--win)}
.box.win .diff{color:var(--win-text)}
.foot{color:var(--muted);font-size:13px;padding:4px 4px 0}
.foot strong{display:block;color:#dbdee1;margin-bottom:4px;font-size:14px}
@media(max-width:820px){.layout{grid-template-columns:1fr}.results{position:static}}
@media(max-width:560px){.cfg{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.row>div:nth-child(2){grid-column:1/-1;order:3}}
</style>
</head>

$("pill").textContent = `Yana: ${TOKENS_PER_MATERIAL} Gold Tokens por material`;

function renderTabs(){
  $("tabs").innerHTML = "";
  Object.keys(IMBUEMENTS).forEach(name=>{
    const b = document.createElement("button");
    b.className = "tab"; b.role = "tab"; b.textContent = name;
    b.setAttribute("aria-selected", name===current);
    b.onclick = ()=>{ current = name; manualK = null; renderTabs(); renderRows(); calc(); };
    $("tabs").appendChild(b);
  });
}

        const i = +btn.dataset.i;
        manualK = btn.dataset.m==="token" ? i+1 : i; // cumulativo: prefixo com token

function calc(){
  const n = +$("tier").value;
  const tp = num($("tokenPrice").value);
  const mats = IMBUEMENTS[current].slice(0,n);
  const marketCost = mats.map(([,qty],i)=> qty * (num(prices[current+"|"+i])));
  const tokenCost = mats.map(()=> TOKENS_PER_MATERIAL * tp);
  const fee = SHRINE_FEE[n];

  // k = quantos primeiros materiais vão por token
  const total = k => fee + tokenCost.slice(0,k).reduce((a,b)=>a+b,0) + marketCost.slice(k).reduce((a,b)=>a+b,0);
  let bestK = 0;
  for(let k=1;k<=n;k++) if(total(k) < total(bestK)) bestK = k;

  const allMarket = total(0), allToken = total(n), best = total(bestK);
  const k = manualK===null ? bestK : Math.min(manualK,n);

  document.querySelectorAll(".opt").forEach(b=>{
    const i = +b.dataset.i, isTok = i < k;
    b.setAttribute("aria-pressed", b.dataset.m==="token" ? isTok : !isTok);
  });

  $("bestVal").innerHTML = `${fmt(best)} <small>gp</small>`;
  $("bestTxt").textContent =
    bestK===0 ? "Comprar todos os materiais no Market." :
    bestK===n ? "Trocar todos os materiais por Gold Token com a Yana." :
    `Trocar os ${bestK} primeiros materiais por Gold Token e comprar o resto no Market.`;
  if(manualK!==null) $("bestTxt").textContent += ` (Seu mix: ${fmt(total(k))} gp)`;

  $("mVal").textContent = fmt(allMarket)+" gp";
  $("tVal").textContent = fmt(allToken)+" gp";
  const d = (v)=> v===best ? "menor custo" : "+"+fmt(v-best)+" gp";
  $("mDiff").textContent = d(allMarket);
  $("tDiff").textContent = d(allToken);
  $("boxM").classList.toggle("win", allMarket===best);
  $("boxT").classList.toggle("win", allToken===best);
  $("feeTxt").textContent = `Taxa do shrine inclusa: ${fmt(fee)} gp.`;
}

$("tokenPrice").oninput = ()=>{ manualK=null; calc(); };
$("tier").onchange = ()=>{ manualK=null; renderRows(); calc(); };

renderTabs(); renderRows(); calc();
</script>
